AWSTemplateFormatVersion: '2010-09-09'
# LanguageExtensions allows Fn::If in DeletionPolicy and UpdateReplacePolicy (Retain only in prod, plan R-5).
# It must come before the SAM transform.
Transform:
  - AWS::LanguageExtensions
  - AWS::Serverless-2016-10-31
Description: Alameda directory (spec 002). One stack per environment.

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - prod
    Description: Environment name. The same template is deployed to both (spec 002 AC-1.2).
  DatabaseName:
    Type: String
    Default: alameda
    AllowedPattern: '[a-z][a-z0-9_]*'
    Description: Name of the PostgreSQL database created in the cluster.
  FrontendOrigin:
    Type: String
    AllowedPattern: 'https://[a-z0-9.-]+'
    Description: URL of this environment's Cloudflare Pages project, the only origin allowed by CORS (spec AC-2.4, plan P-14).

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

# Per-environment database settings (plan P-1, spec AC-3.4).
Mappings:
  DatabaseSettings:
    dev:
      MinCapacity: 0
      MaxCapacity: 1
      BackupRetentionDays: 1
    prod:
      MinCapacity: 0.5
      MaxCapacity: 2
      BackupRetentionDays: 7

Resources:
  # Network for the database only (plan P-5): two private subnets, no internet gateway, no NAT.
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      Tags:
        - Key: Name
          Value: !Sub alameda-${Environment}-vpc

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub alameda-${Environment}-private-a

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub alameda-${Environment}-private-b

  # No inbound rules: only the Data API reaches the database (spec AC-3.2).
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Aurora cluster. No inbound rules, access only through the RDS Data API.
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub alameda-${Environment}-db-sg

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for the Aurora cluster.
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB

  DatabaseCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      DBClusterIdentifier: !Sub alameda-${Environment}-db
      Engine: aurora-postgresql
      # Latest 17.x in us-east-1 on 2026-10-26; the Data API needs 17.4 or newer (plan P-2, V-4).
      EngineVersion: '17.11'
      DatabaseName: !Ref DatabaseName
      MasterUsername: alameda_admin
      # Aurora creates and rotates the password in Secrets Manager (spec I-5, plan P-6).
      ManageMasterUserPassword: true
      EnableHttpEndpoint: true
      StorageEncrypted: true
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VpcSecurityGroupIds:
        - !Ref DatabaseSecurityGroup
      BackupRetentionPeriod: !FindInMap [DatabaseSettings, !Ref Environment, BackupRetentionDays]
      DeletionProtection: !If [IsProd, true, false]
      ServerlessV2ScalingConfiguration:
        MinCapacity: !FindInMap [DatabaseSettings, !Ref Environment, MinCapacity]
        MaxCapacity: !FindInMap [DatabaseSettings, !Ref Environment, MaxCapacity]
        # Auto-pause only applies when MinCapacity is 0, so only in dev.
        SecondsUntilAutoPause: !If [IsProd, !Ref AWS::NoValue, 3600]

  # One writer; the Data API runs queries on the writer only (plan V-4).
  DatabaseWriter:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      DBInstanceIdentifier: !Sub alameda-${Environment}-db-writer
      DBClusterIdentifier: !Ref DatabaseCluster
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
      PubliclyAccessible: false

  # Backend (plan P-3, P-4). The function name is fixed so the log group name is known in advance.
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/alameda-${Environment}-api
      RetentionInDays: 30

  # Only the permissions of the infrastructure spec ("Least privilege and secrets"). No managed policies,
  # so nothing broader is granted.
  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: api-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt ApiLogGroup.Arn
              - Effect: Allow
                Action: rds-data:ExecuteStatement
                Resource: !GetAtt DatabaseCluster.DBClusterArn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !GetAtt DatabaseCluster.MasterUserSecret.SecretArn
              # The two SecureString parameters of this environment (design D-8). A person stores their
              # values with the command in infra/README.md; the template never holds them.
              - Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/alameda/${Environment}/admin-key
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/alameda/${Environment}/anthropic-api-key
              # Decrypting is allowed only through SSM and only for those two parameters (design D-9).
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Sub arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
                    kms:EncryptionContext:PARAMETER_ARN:
                      - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/alameda/${Environment}/admin-key
                      - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/alameda/${Environment}/anthropic-api-key

  # CORS allows only the frontend origin of this environment (spec AC-2.4). The HTTP API answers the
  # preflight of the editing routes itself (design D-15).
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
        AllowMethods:
          - GET
          - POST
          - PUT
        AllowHeaders:
          - authorization
          - content-type

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub alameda-${Environment}-api
      CodeUri: ../backend
      Handler: lambda.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 10
      Role: !GetAtt ApiRole.Arn
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      # No VpcConfig: the function reaches the database only through the Data API (spec AC-2.2).
      Environment:
        Variables:
          DATA_API_CLUSTER_ARN: !GetAtt DatabaseCluster.DBClusterArn
          DATA_API_SECRET_ARN: !GetAtt DatabaseCluster.MasterUserSecret.SecretArn
          DATABASE_NAME: !Ref DatabaseName
          # Only the parameter names; the function reads the values at run time (design D-8).
          ADMIN_KEY_PARAMETER: !Sub /alameda/${Environment}/admin-key
          ANTHROPIC_API_KEY_PARAMETER: !Sub /alameda/${Environment}/anthropic-api-key
          # Stack traces in the logs point to the TypeScript source (backend/Makefile builds the source map).
          NODE_OPTIONS: --enable-source-maps
      Events:
        ListBusinesses:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /businesses
            Method: GET
        # The business-editing routes (business-editing spec). Express checks the admin key.
        InterpretOpeningHours:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /businesses/{id}/opening-hours/interpretation
            Method: POST
        SaveOpeningHours:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /businesses/{id}/opening-hours
            Method: PUT
    # backend/Makefile bundles with esbuild through pnpm (plan section 7). Needs build_in_source (samconfig.toml).
    Metadata:
      BuildMethod: makefile

Outputs:
  Environment:
    Description: Environment this stack belongs to.
    Value: !Ref Environment
  ClusterArn:
    Description: Aurora cluster ARN, used by the Data API.
    Value: !GetAtt DatabaseCluster.DBClusterArn
  SecretArn:
    Description: ARN of the Aurora-managed master user secret, used by the Data API.
    Value: !GetAtt DatabaseCluster.MasterUserSecret.SecretArn
  ApiUrl:
    Description: Base URL of the HTTP API (VITE_API_BASE_URL for the frontend build).
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  FrontendUrl:
    Description: Public URL of the directory (Cloudflare Pages).
    Value: !Ref FrontendOrigin
